<!DOCTYPE html>
<!-- Source for docs/assets/img/og.jpg, the 1200x630 link-preview card (og:image).
     Regenerate: serve the repo root (python3 -m http.server --bind localhost 8766), open
     /tools/og-image.html in a 1200x630 viewport, screenshot it, and save as JPEG quality 90
     (keep it under ~300 KB so WhatsApp shows the large preview). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>sh_lab preview card</title>
<style>
@font-face { font-family: "Archivo"; src: url("../docs/assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Instrument Sans"; src: url("../docs/assets/fonts/instrument-sans.woff2") format("woff2"); font-weight: 400 700; font-stretch: 75% 100%; }
@font-face { font-family: "Martian Mono"; src: url("../docs/assets/fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
:root {
  --stage: #050807; --ink: #e7eee9; --ink-2: #9fb0a6; --green: #5fbf8c; --gold: #e2b65c;
  --line: rgba(95, 191, 140, .07); --cell: #1d3a2c; --cell-edge: #24483a;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--stage); }
body {
  position: relative; color: var(--ink); font-family: "Instrument Sans", sans-serif;
  background:
    radial-gradient(60% 80% at 22% 40%, rgba(95,191,140,.10), transparent 70%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
    var(--stage);
}
.copy { position: absolute; left: 72px; top: 72px; width: 680px; }
.eyebrow { font: 500 17px/1 "Martian Mono", monospace; font-stretch: 87.5%; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h1 { margin-top: 30px; font: 750 80px/.92 "Archivo", sans-serif; font-stretch: 72%; letter-spacing: -.01em; text-transform: uppercase; }
h1 span { display: block; white-space: nowrap; }
h1 .green { color: var(--green); text-shadow: 0 0 40px rgba(95,191,140,.35); }
.facts { list-style: none; padding: 0; margin-top: 40px; display: grid; gap: 14px; }
.facts li { font: 600 25px/1.2 "Instrument Sans", sans-serif; color: var(--ink); display: flex; align-items: center; gap: 14px; }
.facts li::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--green); flex: none; }
.url { position: absolute; left: 72px; bottom: 56px; font: 500 21px/1 "Martian Mono", monospace; font-stretch: 87.5%; color: var(--gold); letter-spacing: .02em; }
.board { position: absolute; right: 64px; top: 88px; width: 340px; }
.grid {
  display: grid; grid-template-columns: repeat(32, 1fr); gap: 3px; padding: 14px;
  background: #0b1511; border: 1px solid var(--cell-edge); border-radius: 10px;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(95,191,140,.05);
  transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); transform-origin: 60% 50%;
}
.grid i { aspect-ratio: 1; background: var(--cell); border-radius: 1.5px; }
.readout { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; margin-top: 26px; font: 500 13px/1 "Martian Mono", monospace; letter-spacing: .05em; color: var(--ink-2); text-transform: uppercase; }
.readout b { color: var(--ink); font-weight: 700; }
.readout .zero b { color: var(--green); font-size: 20px; }
</style>
</head>
<body>
<div class="copy">
  <p class="eyebrow">Dimitris Pournatzis · Cybersecurity homelab</p>
  <h1><span>One Raspberry Pi 5.</span><span class="green">No open ports.</span></h1>
  <ul class="facts">
    <li>Six layers of defense</li>
    <li>Monitored end to end</li>
    <li>Incident reports with verification</li>
  </ul>
</div>
<p class="url">dimpourn.github.io/sh_lab</p>
<div class="board" aria-hidden="true">
  <div class="grid" id="grid"></div>
  <p class="readout"><span>TCP 1–1024</span><span>Scanned <b>1024</b></span><span class="zero">Open <b>0</b></span></p>
</div>
<script>
  const grid = document.getElementById("grid");
  grid.append(...Array.from({ length: 1024 }, () => document.createElement("i")));
</script>
</body>
</html>
